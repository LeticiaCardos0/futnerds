<!--
  Palco do mapa da liga. O mapa e os painéis são `fixed` (ver mapa-liga.css):
  os painéis flutuam por cima e o padding do enquadramento na config reserva
  exatamente a largura deles.
-->
<div class="ml-palco bg-bg">
  @if (config(); as cfg) {
    <app-mapa-liga
      #mapa
      [config]="cfg"
      [clubes]="clubes()"
      [cidades]="cidades()"
      [cidadesSemTime]="cidadesSemTime()"
      [selecionadoId]="selecionadoId()"
      (clubeSelecionado)="aoSelecionar($event, mapa)" />

    <app-painel-pais
      [paisNome]="cfg.paisNome"
      [paisCodigo]="cfg.paisCodigo"
      [ligaNome]="cfg.ligaNomeBase"
      [clubes]="clubes()"
      [selecionadoId]="selecionadoId()"
      (clubeSelecionado)="aoSelecionar($event, mapa)" />

    @if (clubeSelecionado(); as sel) {
      <app-painel-clube
        [clube]="sel"
        [paisNome]="cfg.paisNome"
        [ligaNome]="cfg.ligaNomeBase"
        [fundacao]="fundacao()" />
    }

    <app-controles-mapa
      [ativo3d]="ativo3d()"
      (bussola)="mapa.voltarEnquadramento(); ativo3d.set(false)"
      (aproximar)="mapa.aproximar()"
      (afastar)="mapa.afastar()"
      (alternar3d)="alternar3d(mapa, $event)" />
  } @else {
    <div class="absolute inset-0 grid place-items-center px-6 text-center">
      <div>
        <i class="pi pi-map text-accent text-4xl"></i>
        <h1 class="mt-4 text-2xl font-black uppercase tracking-tighter">Mapa em breve</h1>
        <p class="mt-2 text-fg-subtle text-sm">
          Ainda não temos o mapa desta liga. Por enquanto só a Premier League tem.
        </p>
        <a routerLink="/ligas"
          class="mt-6 inline-block text-accent hover:underline text-sm font-bold">
          Voltar para as ligas
        </a>
      </div>
    </div>
  }
</div>
