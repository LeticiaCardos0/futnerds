<!--
  FutNerds · Tela "Nações" — globo 3D interativo.
  IDs mantidos idênticos aos usados pelo motor (nacoes-engine.ts), que
  localiza estes elementos via document.getElementById após a view montar.
-->

<div class="pagina-nacoes">

  <div class="palco">

    <!-- Coluna de apresentação -->
    <section class="nacoes-intro">
      <p class="nacoes-eyebrow"><i class="fa-solid fa-crown" aria-hidden="true"></i> Mundo do futebol</p>
      <h1 class="nacoes-titulo">
        Explore os países
        <span>do futebol mundial</span>
      </h1>
      <p class="nacoes-texto">
        Descubra ligas, clubes e jogadores de todos os países. Explore o futebol sem fronteiras.
      </p>

      <!-- Navegador: filtros de liga e país (o motor preenche as listas) -->
      <div class="nacoes-navegador">
        <div class="nacoes-filtros">
          <div id="filtro-liga" class="nacoes-filtro nacoes-filtro--liga">
            <span class="filtro-icone" aria-hidden="true"><i class="pi pi-trophy"></i></span>
            <input class="filtro-campo" type="text" placeholder="Ligas" autocomplete="off" spellcheck="false"
              role="combobox" aria-label="Filtrar por liga" aria-autocomplete="list"
              aria-expanded="false" aria-controls="filtro-liga-lista" />
            <button type="button" class="filtro-limpar" aria-label="Limpar liga" hidden><i class="pi pi-times"></i></button>
            <i class="pi pi-chevron-down filtro-seta" aria-hidden="true"></i>
            <ul id="filtro-liga-lista" class="filtro-lista" role="listbox" aria-label="Ligas" hidden></ul>
          </div>

          <div id="filtro-pais" class="nacoes-filtro nacoes-filtro--pais">
            <span class="filtro-icone" aria-hidden="true"><i class="pi pi-globe"></i></span>
            <input class="filtro-campo" type="text" placeholder="País/região" autocomplete="off" spellcheck="false"
              role="combobox" aria-label="Filtrar por país ou região" aria-autocomplete="list"
              aria-expanded="false" aria-controls="filtro-pais-lista" />
            <button type="button" class="filtro-limpar" aria-label="Limpar país" hidden><i class="pi pi-times"></i></button>
            <i class="pi pi-chevron-down filtro-seta" aria-hidden="true"></i>
            <ul id="filtro-pais-lista" class="filtro-lista" role="listbox" aria-label="Países e regiões" hidden></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Globo 3D -->
    <section class="area-globo">
      <div id="globo-canvas"></div>

      <!-- Card do país sob o mouse (some quando o cursor sai) -->
      <div id="tooltip" class="tooltip"></div>

      <div class="globo-rodape">
        <div class="globo-controles">
          <button id="zoom-out" class="controle-botao" aria-label="Diminuir zoom">−</button>
          <button id="zoom-in" class="controle-botao" aria-label="Aumentar zoom">+</button>
        </div>
        <p class="globo-dica">Arraste o globo para explorar <i class="fa-solid fa-hand" aria-hidden="true"></i></p>
      </div>
    </section>

    <!-- Painel do país selecionado (preenchido dinamicamente pelo motor) -->
    <aside id="painel" class="painel"></aside>

  </div>

  <div class="nacoes-faixa">
    <p class="nacoes-faixa-marca">
      <i class="pi pi-circle-fill" aria-hidden="true"></i>
      <strong>FutNerds</strong>
      <span>Mais que um jogo, é uma comunidade.</span>
    </p>
    <p class="nacoes-faixa-lema"><span class="nacoes-faixa-barras">///</span> Explorar / Descobrir / Evoluir</p>
  </div>

</div>

<!-- Overlay para fechar o painel-bottom-sheet no mobile -->
<div id="bottom-sheet-overlay" class="bottom-sheet-overlay"></div>
