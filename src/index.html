<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Projeto Futnerds Ng</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontes de interface. Uniao exata dos pesos que antes vinham de dois
       lugares (este link + o @import do home.scss), para a home nao mudar de
       aparencia: Barlow Condensed 400/600/700/800, Inter 300..700,
       JetBrains Mono 400/500/700 e Material Symbols (a classe .ms do home.html).
       Aqui e nao em CSS de componente: @import de fonte dentro de styleUrl e
       inlinado pelo Angular e contabilizado no budget anyComponentStyle. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <!-- Rajdhani: fonte de interface. Source Serif 4 itálico: só os nomes de
       cidades pequenas no mapa. Link separado do de cima de propósito — o
       Angular inlina cada URL de fonte e a contabiliza no budget
       anyComponentStyle (16 kB), então juntar tudo num único link aumenta o
       risco de estourar o limite. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
</head>

</body>
</html>
