<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUTNERDS — Mapa de clubes (satélite)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#030506;--panel:rgba(5,8,9,.9);--line:rgba(255,255,255,.08);--green:#00D639;--green2:#0B7F35;--text:#F2F5F2;--muted:#8D9694}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
a{color:inherit;text-decoration:none}
#map{position:absolute;inset:64px 0 0 0}
.maplibregl-ctrl-attrib{background:rgba(3,5,6,.7)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}

/* navbar */
.nav{position:absolute;inset:0 0 auto 0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(3,5,6,.96);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:700}
.brand b{color:var(--green);font-weight:700}
.nav nav{display:flex;gap:40px;height:64px}
.nav nav a{display:flex;align-items:center;font-size:18px;font-weight:500;color:var(--muted)}
.nav nav a[aria-current]{color:var(--text);font-weight:700;box-shadow:inset 0 -3px 0 var(--green)}
.nav-actions{display:flex;gap:12px}
.btn{height:44px;padding:0 20px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;font-size:17px;font-weight:600}
.btn-green{border:none;background:var(--green);color:#021307;font-weight:700}

/* panels */
.panel{position:absolute;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px)}
.left{left:28px;top:88px;width:312px}
.back{display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border:none;border-bottom:1px solid var(--line);background:none;color:var(--green);font-size:16px;font-weight:600;width:100%;text-align:left}
.country{display:flex;align-items:center;gap:14px;padding:16px 18px 12px}
.country h1{margin:0;font-size:26px;letter-spacing:.03em;line-height:1.05}
.country p{margin:0;color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:0 18px 14px;border-bottom:1px solid var(--line)}
.stats strong{display:block;font-size:22px}.stats span{font-size:14px;color:var(--muted)}
.sec{padding:14px 18px 8px;font-size:14px;font-weight:700;color:var(--muted)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 14px}
.chip{height:36px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:15px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden}
.chip[aria-pressed=true]{border-color:var(--green);background:rgba(0,214,57,.12)}
.dot{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;box-shadow:0 0 0 1.5px rgba(255,255,255,.3)}

.right{right:28px;top:88px;width:372px;padding:10px;display:flex;flex-direction:column;gap:10px}
.hero{position:relative;height:142px;border-radius:12px;overflow:hidden;transition:background .4s}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,5,6,.85),transparent 70%)}
.hero-row{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:14px;z-index:1}
.crest{flex-shrink:0;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;border:3px solid #0b1012;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.6)}
.hero h2{margin:0;font-size:28px;line-height:1.05}.hero small{font-size:16px;color:#C9D0CE}
.fav{margin-left:auto;flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(3,5,6,.6);color:var(--green);display:grid;place-items:center}
.fav[aria-pressed=true] svg{fill:var(--green)}
.info{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);padding:4px 14px 14px}
.row{display:flex;align-items:center;gap:14px;height:52px;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-of-type{border-bottom:none}
.row small{display:block;font-size:13px;color:var(--muted)}.row span{font-size:17px;font-weight:600}
.row svg{flex-shrink:0;stroke:var(--muted)}
.cta{width:100%;margin-top:6px;height:46px;border-radius:10px;border:1.5px solid var(--green);background:rgba(0,214,57,.06);color:var(--green);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.cta.alt{border-color:rgba(255,255,255,.16);color:var(--text);background:transparent}

.crumb{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:10;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px 0 4px;border-radius:22px;background:rgba(4,7,8,.9);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
.crumb button{height:36px;padding:0 12px;border-radius:18px;border:none;background:rgba(0,214,57,.12);color:var(--green);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.crumb strong{font-size:22px;letter-spacing:.06em}.crumb span{color:var(--muted);font-size:15px}
.crumb.hint{padding:0 16px;font-size:15px;color:#C9D0CE;gap:8px}
.crumb.hint i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

.ctrls{position:absolute;left:364px;bottom:150px;display:flex;gap:10px;z-index:10}
.round{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:var(--panel);display:grid;place-items:center;padding:0}
.zoom{display:flex;flex-direction:column;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:var(--panel);overflow:hidden}
.zoom button{width:44px;height:26px;border:none;background:transparent;font-size:20px;font-weight:600;padding:0}
.zoom button+button{border-top:1px solid rgba(255,255,255,.1)}
.v3d{height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:var(--panel);font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.v3d[aria-pressed=true]{border-color:var(--green)}
.v3d i{width:8px;height:8px;border-radius:50%;background:#3A4442}
.v3d[aria-pressed=true] i{background:var(--green);box-shadow:0 0 8px var(--green)}

.strip{position:absolute;left:28px;right:28px;bottom:20px;height:104px;z-index:10;padding:12px 14px;border-radius:16px;background:rgba(5,8,9,.92);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.strip h3{margin:0;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--green)}
.strip-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.ctry{height:50px;color:var(--text);display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left}
.ctry span{display:flex;flex-direction:column;font-size:16px;font-weight:600}.ctry small{font-size:13px;color:var(--muted);font-weight:500}

/* nomes das cidades (o script escolhe o lado livre e esconde os que não cabem, como no Google Maps) */
.lbl{width:0;height:0;pointer-events:none}
.lbl span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;color:#fff;
  text-shadow:0 0 2px #000,0 0 4px #000,0 0 10px rgba(0,0,0,.9)}
.lbl.club span{font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.lbl.minor span{font-family:'Source Serif 4',serif;font-style:italic;font-weight:400;letter-spacing:.01em;color:rgba(242,234,214,.86);
  text-shadow:0 0 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.65)}   /* tom creme de atlas, um pouco transparente */
.lbl.minor.r1 span{font-size:13px}                         /* cidades médias */
.lbl.minor.r2 span{font-size:12px;color:rgba(242,234,214,.74)} /* cidades menores (só com zoom) */
.lbl.minor.big span{font-size:14px;color:rgba(246,239,220,.94)} /* cidades grandes */
.lbl .cdot{position:absolute;width:5px;height:5px;margin:1px;border-radius:50%;background:rgba(242,234,214,.9);box-shadow:0 0 3px rgba(0,0,0,.8)}
/* waypoints dos times (a ponta fica no estádio) */
.wpm{width:34px;height:44px} /* sem position aqui: o MapLibre posiciona o marcador */
.wpm .lead{position:absolute;left:17px;top:44px;height:1.5px;background:rgba(0,214,57,.75);transform-origin:0 50%;pointer-events:none}
.wpm .spot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(0,214,57,.9);pointer-events:none}
.wp{position:absolute;inset:0;padding:0;border:none;background:none;transform-origin:50% 100%;transition:transform .2s}
.wp .head{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:#0B1012;border:2px solid rgba(0,214,57,.6);box-shadow:0 0 10px rgba(0,214,57,.5),0 4px 10px rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.wp .head .dot{width:25px;height:25px;font-size:9px;box-shadow:none}
.wp .head img{width:27px;height:27px;object-fit:contain}
.wp .tip{position:absolute;left:11px;top:33px;width:12px;height:11px;background:var(--green);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 0 4px rgba(0,214,57,.8))}
.wp .name{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);height:24px;padding:0 10px;border-radius:12px;background:rgba(4,7,8,.92);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:600;line-height:22px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.wp:hover,.wp:focus-visible{transform:scale(1.12)}
.wp:hover .name,.wp:focus-visible .name{opacity:1}
.wp.sel{transform:scale(1.15)}
.wp.sel .head{border:3px solid var(--green);box-shadow:0 0 0 3px rgba(0,214,57,.25),0 0 24px rgba(0,214,57,.95)}
.wp.sel .name{opacity:1;background:var(--green);color:#021307;border-color:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

</div>

    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      var box = { x1: p.x + c[0] - W - pad, x2: p.x + c[0] + W + pad, y1: p.y + c[1] - H - pad, y2: p.y + c[1] + H + pad };
      var ov = 0; placed.forEach(function (b) { ov += overlapArea(box, b); });
      if (ov < bestOv) { best = c; bestOv = ov; bestBox = box; }
      if (ov === 0) break;
    }
    if (bestOv > 0 && !l.club) { l.el.style.display = "none"; return; }
    l.el.style.display = "block";
    l.marker.setOffset(best);
    if (l.dot) { l.dot.style.left = (-best[0] - 3.5) + "px"; l.dot.style.top = (-best[1] - 3.5) + "px"; placed.push({ x1: p.x - 5, x2: p.x + 5, y1: p.y - 5, y2: p.y + 5 }); }
    placed.push(bestBox);
  });
}

// Waypoints: um por time, com a ponta no estádio
var wps = CLUBS.map(function (c) {
  var wrap = el("div", "wpm");
  var lead = el("span", "lead"), spot = el("span", "spot");
  var b = el("button", "wp"); b.setAttribute("aria-label", c.name);
  var head = el("span", "head");
  if (c.crest) { var img = el("img"); img.src = c.crest; img.alt = ""; head.appendChild(img); }
  else head.appendChild(badge(c));
  var nm = el("span", "name"); nm.textContent = c.short;
  b.appendChild(el("span", "tip")); b.appendChild(head); b.appendChild(nm);
  b.onclick = function (e) { e.stopPropagation(); select(c.id); };
  wrap.appendChild(lead); wrap.appendChild(spot); wrap.appendChild(b);
  var marker = new maplibregl.Marker({ element: wrap, anchor: "bottom" }).setLngLat([c.lng, c.lat]).addTo(map);
  return { club: c, marker: marker, wrap: wrap, btn: b, lead: lead, spot: spot };
});
var wpEls = {}; wps.forEach(function (w) { wpEls[w.club.id] = w.btn; });

// Quando dois estádios ficam muito perto na tela (ex.: Londres), os waypoints se afastam o mínimo necessário
// e uma linha fina liga cada um ao ponto exato do estádio. Com zoom, eles voltam pro lugar certo sozinhos.
function declutter() {
  var orig = wps.map(function (w) { return map.project([w.club.lng, w.club.lat]); });
  var pos = orig.map(function (p) { return { x: p.x, y: p.y }; });
  for (var it = 0; it < 40; it++) {
    var moved = false;
    for (var i = 0; i < pos.length; i++) for (var j = i + 1; j < pos.length; j++) {
      var dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y, d = Math.hypot(dx, dy);
      if (d >= MIN_GAP) continue;
      if (d < 0.01) { var a = (i * 2.4 + j) % 6.283; dx = Math.cos(a); dy = Math.sin(a); d = 1; }
      var push = (MIN_GAP - d) / 2 + 0.1;
      pos[i].x -= dx / d * push; pos[i].y -= dy / d * push;
      pos[j].x += dx / d * push; pos[j].y += dy / d * push;
      moved = true;
    }
    if (!moved) break;
  }
  wps.forEach(function (w, i) {
    var ox = pos[i].x - orig[i].x, oy = pos[i].y - orig[i].y, len = Math.hypot(ox, oy);
    w.marker.setOffset([ox, oy]);
    w.lead.style.display = w.spot.style.display = len > 2 ? "block" : "none";
    w.lead.style.width = len + "px";
    w.lead.style.transform = "rotate(" + Math.atan2(-oy, -ox) + "rad)";
    w.spot.style.left = (17 - ox - 3.5) + "px"; w.spot.style.top = (44 - oy - 3.5) + "px";
  });
  layoutLabels(pos.map(function (q) { return { x1: q.x - 18, x2: q.x + 18, y1: q.y - 46, y2: q.y + 2 }; }));
}
map.on("load", function () { measureLabels(); declutter(); });
if (document.fonts) document.fonts.ready.then(function () { measureLabels(); declutter(); });
map.on("move", declutter);
window.addEventListener("resize", declutter);

function select(id) {
  state.sel = id;
  var c = byId(id);
  var ct = CITIES.filter(function (k) { return k.id === c.city; })[0];
  document.getElementById("hero").style.background = "linear-gradient(120deg," + c.color + " 0%,#0a0e0f 80%)";
  var cr = document.getElementById("crest"); cr.textContent = c.id; cr.style.background = c.color; cr.style.color = c.fg;
  document.getElementById("cName").textContent = c.name;
  document.getElementById("cCity").textContent = ct.name;
  document.getElementById("cStadium").textContent = c.stadium;
  document.getElementById("cFounded").textContent = c.founded;
  document.getElementById("fav").setAttribute("aria-pressed", state.favs[id] ? "true" : "false");
  document.querySelectorAll(".chip").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.id === id ? "true" : "false"); });
  wps.forEach(function (w) {
    var on = w.club.id === id;
    w.btn.classList.toggle("sel", on); w.btn.setAttribute("aria-pressed", on ? "true" : "false");
    w.wrap.style.zIndex = on ? 5 : 1;
  });
}

function fitEngland() {
  state.tilt = false; syncTilt();
  map.fitBounds(ENGLAND_BOUNDS, { padding: PAD, pitch: 0, bearing: 0, duration: reduced ? 0 : 1200 });
}
function syncTilt() {
  document.getElementById("v3d").setAttribute("aria-pressed", state.tilt ? "true" : "false");
  map.setTerrain(state.tilt ? { source: "dem", exaggeration: 1.4 } : null);
}

// Painel da esquerda
var chips = document.getElementById("chips");
CLUBS.forEach(function (c) {
  var b = el("button", "chip"); b.dataset.id = c.id;
  b.appendChild(badge(c)); b.appendChild(el("span", null, c.short));
  b.onclick = function () { select(c.id); };
  chips.appendChild(b);
});
// Faixa de países: cada um abre a tela do próprio país (aqui na demo não faz nada)

var row = document.getElementById("countries");
COUNTRIES.forEach(function (k) {

document.getElementById("back").onclick = fitEngland;
document.getElementById("north").onclick = fitEngland;
document.getElementById("zin").onclick = function () { map.zoomIn(); };
document.getElementById("zout").onclick = function () { map.zoomOut(); };
document.getElementById("v3d").onclick = function () {
  state.tilt = !state.tilt; syncTilt();
  map.easeTo({ pitch: state.tilt ? 45 : 0, duration: reduced ? 0 : 900 });
};
document.getElementById("fav").onclick = function () {
  state.favs[state.sel] = !state.favs[state.sel];
  this.setAttribute("aria-pressed", state.favs[state.sel] ? "true" : "false");
};

select("LIV");
</script>
